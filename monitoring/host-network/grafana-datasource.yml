# Host-network example. Update your existing datasource instead of provisioning
# a second datasource with the same name/UID. The dashboard lets you select it.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
