# Example for the mini PC's existing host-network monitoring stack.
# Merge these jobs with your current config; preserve any other existing jobs.
# Mount prometheus-alerts.yml at /etc/prometheus/alerts.yml to load the rules.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: muslim-api
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:8000]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: node-exporter
    static_configs:
      - targets: [127.0.0.1:9100]
